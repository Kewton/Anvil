goal: "あなたが考える最高に面白くかっこいいスペースインベーダーゲームを3011ポートで起動可能なnext.jsアプリとして開発してください。"
profile: "nextjs"
style: "default"
intent: "create"
phases:
  - id: "setup-and-base-layout"
    prompt: "Initialize the Next.js project with Tailwind CSS. Configure package.json to run development server on port 3011 (`next dev -p 3011`). Create a dark cyber-themed page layout and basic app shell with tailwind.config.js and postcss.config.js."
  - id: "game-engine-core"
    prompt: "Implement the core Space Invaders game engine using HTML5 Canvas API inside a React component. Include smooth player movement, projectile physics, grid-based alien movement, responsive screen bounds, and collision detection."
  - id: "game-polish-and-effects"
    prompt: "Add 'cool' visual and gameplay features: neon particle explosion effects, subtle screen shake on damage, item drops/power-ups (like triple shot, shield, and laser beam), a combo scoring system, progressive difficulty waves, and dynamic synth sound effects synthesized via the Web Audio API."
  - id: "ui-and-responsiveness"
    prompt: "Design a stylish retro arcade UI with a start menu, difficulty selector, high-score board using localStorage, and responsive virtual touch controls (joystick/buttons) for mobile players."
  - id: "build-and-verify"
    prompt: "Verify the production build of the Next.js application by running `npm run build` to ensure there are no TypeScript, React, or configuration errors."
