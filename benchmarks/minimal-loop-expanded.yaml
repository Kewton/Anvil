  - name: fix-shell-safe-clean
    task_kind: coding
    scenario_category: existing_code_fix
    prompt: |
      Create scripts/safe_clean.sh. It should remove only build/, dist/, and coverage/ under the current directory after printing what it will remove.
    success_check:
