goal: "あなたが考える最高に面白くかっこいいスペースインベーダーゲームを3011ポートで起動可能なnext.jsアプリとして開発してください。"
profile: "nextjs"
style: "default"
intent: "create"
phases:
  - id: "project-setup"
    prompt: "Set up the Next.js project structure with Tailwind CSS, PostCSS, and Autoprefixer. Configure package.json scripts for 'dev' and 'start' to use port 3011. Create a basic layout and a landing page containing the game container."
  - id: "game-engine"
    prompt: "Implement the core game engine using a requestAnimationFrame loop. Develop the player ship movement, alien grid spawning with movement patterns (shifting sides and dropping down), and a projectile system for both player and aliens."
  - id: "combat-mechanics"
    prompt: "Implement collision detection between projectiles and entities. Add scoring logic, health/life management, win/loss condition triggers, and an efficient state management system to track game progress."
  - id: "visual-polish-ui"
    prompt: "Add high-impact visual effects such as particles on explosion, screen shake, and a neon aesthetic using Tailwind. Implement the UI overlays for 'Start Game', 'Game Over', and 'Victory' screens. Add observability hooks: data-anvil-action='primary' on start/restart buttons, data-anvil-action='input' if any text input exists, and data-anvil-state displaying game status (score, lives, state) on the main container."
  - id: "final-verification"
    prompt: "Perform a final code cleanup. Ensure all dependencies are correctly listed in package.json. Run 'npm run build' to verify that the application compiles successfully without errors."
