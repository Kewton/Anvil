[vocabulary]
source = "evidence_knowledge"
sections = ["vocabulary", "goal_hints.translations"]

[guidance.generic]
generic_interaction = "input operations must visibly change actual application state, and that change must be reflected in the data-anvil-state JSON snapshot; wire input handlers to state updates."
start_interaction = "primary/start controls must transition the visible app state before input is evaluated; wire the start action into state and render updates."

[guidance.canvas_game]
canvas_game_interaction = "keyboard or pointer input must visibly change game state (player position, projectiles, score/health, or state transitions); wire input handlers into the render/update loop."
canvas_render_loop_checklist = "render-loop checklist: ref attached -> effect runs -> rAF loop starts -> draw calls"
canvas_input_wiring_checklist = "input-wiring checklist: keyboard or pointer input must visibly change game state (player position, projectiles, score/health, or state transitions); wire input handlers into the render/update loop."

[guidance.persistence]
persistence = "load persisted state on mount (e.g. read localStorage in initialization) and write on mutation"

[guidance.contracts]
state_binding_contract = '''Minimum contract: after start and after input, the `data-anvil-state` JSON value must actually change. The snapshot must include at least one dimension that immediately responds to input, such as player/paddle x position. If refs are used, mirror meaningful state changes into React state so a render occurs.'''
input_coupled_dimension_requirement = "入力は {mutation_refs} を変異させるが data-anvil-state に映らない。入力連動次元（例: プレイヤー/パドルのx座標）をReact stateにミラーしてスナップショットへ追加せよ。"
contract_attribute_missing_kind = "contract_attribute_missing"
contract_attribute_guidance = '''Contract attribute repair guidance:
- classification: {classification}
- missing attribute: `{attribute}`
- target source file: `{path}`
- contract requirement: {requirement}
- location directive: add the missing attribute to the route-bound container, control, or status element in the same rendered hierarchy as the existing hooks below.
Existing hook locations:
{excerpts}
Generic one-line example:
- {example}
'''
state_requirement = "provide a meaningful visible-state JSON snapshot after each render, and include at least one input-coupled dimension such as a player or paddle x coordinate."
restart_requirement = "mark every restart, retry, or new-game affordance that resets observable state; the primary action alone is not restart evidence."
input_requirement = "mark the main text entry surface when one exists so interaction probes can target input behavior."
primary_requirement = "mark the main start, submit, or primary action control so interaction probes can start the experience deterministically."
state_example = '''data-anvil-state={JSON.stringify({ phase, score, playerX })}'''
restart_example = '''data-anvil-action="restart"'''
input_example = '''data-anvil-action="input"'''
primary_example = '''data-anvil-action="primary"'''

