[package]
name = "anvil"
version = "0.5.0"
edition = "2024"

# Issue #459 / Phase 2: declare an empty workspace so `cargo` does not pick
# up the `Cargo.toml` fixture under `tests/fixtures/stacks/rust/` as a member
# (the fixture is meant to be read as fixture data, not built). The root
# crate stays the only member; `exclude` keeps the fixture tree out.
[workspace]
exclude = ["tests/fixtures"]

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", default-features = false, features = ["events"] }
globset = "0.4"
ignore = "0.4"
libc = "0.2"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"], default-features = false }
rustyline = { version = "14", default-features = false, features = ["with-file-history"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
uuid = { version = "1", default-features = false, features = ["v7", "std"] }

[dev-dependencies]
tempfile = "3"
